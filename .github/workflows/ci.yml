name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --package-path MeqatCore
      - name: Build app (unsigned)
        run: >
          xcodebuild -project Meqat.xcodeproj -scheme Meqat
          -configuration Debug -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
